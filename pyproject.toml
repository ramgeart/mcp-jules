[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jules-mcp-server"
version = "0.1.0"
description = "A remote MCP server for the Google Jules API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.25",
    "fastmcp>=0.1.0",
    "httpx>=0.25",
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
